<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#60a5fa" fill-opacity="0.25" />
    </pattern>

    <!-- Soft Ambient Lights -->
    <radialGradient id="ambient-cyan" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-purple" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes pingDot {
      0% { r: 4px; opacity: 1; }
      70% { r: 12px; opacity: 0; }
      100% { r: 12px; opacity: 0; }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -40; }
    }
    .floating-card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard2 5s ease-in-out infinite; }
    .ping-circle { animation: pingDot 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .pulse-orb { animation: pulseOrb 4s ease-in-out infinite; }
    .radar-line { stroke-dasharray: 6 4; animation: waveDash 3s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />
  <rect width="1200" height="360" fill="url(#cyber-grid)" />
  <circle cx="180" cy="70" r="260" fill="url(#ambient-cyan)" />
  <circle cx="1020" cy="290" r="240" fill="url(#ambient-purple)" />

  <!-- Dynamic Background Graphics (Right & Left Corners, Safely in Background) -->
  <!-- Left Decorative Widget (Chat Visitor Node) -->
  <g class="floating-card-1" opacity="0.65" transform="translate(60, 190)">
    <rect width="180" height="110" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Status badge -->
    <circle cx="24" cy="26" r="6" fill="#10b981" />
    <circle class="ping-circle" cx="24" cy="26" r="6" fill="#10b981" />
    <text x="38" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">LIVE VISITOR</text>
    <path d="M 20 62 Q 70 45, 110 65 T 160 55" fill="none" stroke="#38bdf8" stroke-width="2.5" class="radar-line" />
    <text x="22" y="92" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📍 Berlin, DE • /pricing</text>
  </g>

  <!-- Right Decorative Widget (Omnichannel Chat Stream) -->
  <g class="floating-card-2" opacity="0.7" transform="translate(950, 60)">
    <rect width="190" height="130" rx="14" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Header -->
    <rect x="18" y="18" width="28" height="28" rx="8" fill="#818cf8" fill-opacity="0.2" />
    <text x="26" y="36" fill="#818cf8" font-size="14">💬</text>
    <text x="54" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Real-Time Influx</text>
    <!-- Message 1 -->
    <rect x="18" y="56" width="154" height="26" rx="6" fill="#374151" fill-opacity="0.6" />
    <text x="28" y="73" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Session: 4m 12s • 8 actions</text>
    <!-- Message 2 -->
    <rect x="18" y="88" width="154" height="26" rx="6" fill="#4f46e5" fill-opacity="0.3" stroke="#6366f1" stroke-opacity="0.4" />
    <text x="28" y="105" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Proactive prompt triggered</text>
  </g>

  <!-- Center Hero Content (Clear Foreground, Absolute Center Focus) -->
  <g id="hero-foreground">
    <!-- Category Tag / Top Pill -->
    <g transform="translate(600, 75)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
      <circle cx="-136" cy="0" r="4.5" fill="#38bdf8" class="pulse-orb" />
      <text x="-122" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED AWESOME CATALOG</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">
      Live Chat &amp; Visitor Tracking
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Enterprise SaaS Marketplaces &amp; Self-Hosted Open-Source Conversational Engines
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(600, 238)">
      <!-- Pill 1 -->
      <g transform="translate(-270, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#111827" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💬 Real-Time Chat</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-90, 0)">
        <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#111827" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">👁️ Visitor Journey Tracking</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(100, 0)">
        <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#111827" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 AI Bots &amp; Triggers</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(270, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#111827" stroke="#10b981" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ 100% Self-Hosted</text>
      </g>
    </g>

    <!-- Bottom Accent Border Glow -->
    <rect x="250" y="295" width="700" height="2" rx="1" fill="url(#primary-glow)" opacity="0.6" />
  </g>
</svg>
